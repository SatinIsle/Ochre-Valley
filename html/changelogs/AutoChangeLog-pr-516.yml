author: "SatinIsle"
delete-after: True
changes:
  - rscadd: "A target practice cow that tells you how much you hurt it."
  - balance: "Pistols now deal 70 damage with their projectiles."
  - balance: "Rifles now deal 84 damage with their projectiles."
  - balance: "Arquebus weapons have a 4x mob damage multiplier, keeping their effectiveness against simple mobs the same."
  - balance: "Arquebus weapons gain addition accuracy based on perception and firearms skill."
  - refactor: "Reverted OV changes to ammo_bullets.dm because they are being overwritten elsewhere."
  - refactor: "Arquebus crafting recipes moved to modular_ochrevalley engineering.dm"
  - refactor: "AIPed modular_causticcove ammo.dm, moved all changes to modular_ochrevalley ammo.dm"
  - code_imp: "Renamed ramrod to future proof."
  - balance: "Ammo pouches are now 2x2 grid size, consistent with all other quivers."
  - balance: "Arquebus must now be crafted using the artificer's table."
  - balance: "Arquebus recipe changed to be as mechanically complex to make as a heavy crossbow."
  - balance: "Pistols now require legendary engineering to make. Standard arquebus still only requires mastery."
  - balance: "Bullets will shatter if they strike a wall, destroying them. Don't miss! (Same as heavy crossbows.)"
  - balance: "Arquebus integrity nerfed to 100 from 250, making them 50 points worse than a quarterstaff."
  - balance: "Pistol integrity buffed to 100 from 80. Let's just make these consistent for now and balance more later."
  - balance: "Arquebus has boosted wdefense when wielded, making it decent at parrying—but its integrity means you can do this fewer times."
  - balance: "Pistols are now more expensive to buy from the Silverface."
  - rscadd: "Silver bullets. Not yet implemented in-game, admin spawn until I get around to it."
  - rscadd: "Handgonne. Not yet implemented in-game, admin spawn until I get around to it."
  - qol: "Arquebus in the silverface don't have \"Grenzelhoft\" in the name anymore."